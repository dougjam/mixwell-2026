# =============================================================================
# Shadertoy gallery
# =============================================================================
# Each entry renders as a card whose thumbnail links to `viewUrl` (opens the
# shader on Shadertoy in a new tab). Add an entry by copying a block below and
# dropping a web-optimized thumbnail in public/thumbs/.
# =============================================================================

shaders:
  - id: marbling-patterns
    title: "Marbling Patterns"
    explanation: "Progressive rendering of eight marbling patterns, from Nonpareil to SuperTornado, built from Mixwell Reverse-Drift Functions (RDFs)."
    thumbnail: "thumbs/shader-marbling-patterns.webp"
    viewUrl: "https://www.shadertoy.com/view/sfGGzV"

  - id: mixwell-brush
    title: "Mixwell Brush Demo"
    explanation: "The Mixwell brush marbling a bird, rendered live in a fragment shader."
    thumbnail: "thumbs/shader-brushbird.webp"
    viewUrl: "https://www.shadertoy.com/view/WcdXDn"

  - id: brush-vs-newton
    title: "Brush vs Newton Solver"
    explanation: "One brush stroke (rdSegment) evaluated two ways: the fast time-stepped Mixwell Brush versus the Newton-based time-inversion advection solver."
    thumbnail: "thumbs/shader-brush-vs-newton.webp"
    viewUrl: "https://www.shadertoy.com/view/NfK3RK"

  - id: maxwell-time
    title: "Maxwell Flow Time"
    explanation: "Maxwell's flow-time integral for steady flow past a cylinder, with streamlines. The figure from the paper and talk."
    thumbnail: "thumbs/shader-maxwell-time.webp"
    viewUrl: "https://www.shadertoy.com/view/XXdfz4"

  - id: pixel-zoom
    title: "Pixel Zoom Slide"
    explanation: "Sub-pixel structure of a marbling pattern (Gel-Git and Nonpareil): the pattern, its 16x16 subsamples, and the averaged color."
    thumbnail: "thumbs/shader-pixel-zoom.webp"
    viewUrl: "https://www.shadertoy.com/view/7fK3Ry"

  - id: carlson-elliptic
    title: "Carlson and Elliptic Functions"
    explanation: "A from-scratch GLSL implementation of Carlson's symmetric integrals RF and RD, and the incomplete elliptic functions F and E built from them, following the iterative schemes from [Carlson 1995]."
    thumbnail: "thumbs/shader-carlson-elliptic.webp"
    viewUrl: "https://www.shadertoy.com/view/XXtBD8"

  - id: lcm-demo
    title: "LCM Demo Slide"
    explanation: "A talk slide on periodicity: two stripe textures whose sum tiles at the least common multiple (LCM) of their periods."
    thumbnail: "thumbs/shader-lcm.webp"
    viewUrl: "https://www.shadertoy.com/view/7fd3DH"
