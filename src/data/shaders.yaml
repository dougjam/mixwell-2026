# shader on Shadertoy in a new tab). Add an entry by copying a block below and
# dropping a web-optimized thumbnail in public/thumbs/.
# =============================================================================

shaders:
  - id: mixwell-brush
    title: "Mixwell Brush Demo"
    explanation: "The Mixwell brush marbling a bird, rendered live in a fragment shader."
    thumbnail: "thumbs/shader-brushbird.webp"
    viewUrl: "https://www.shadertoy.com/view/WcdXDn"

  - id: maxwell-time
    title: "Maxwell Flow Time"
    explanation: "Maxwell's flow-time integral for steady flow past a cylinder, with streamlines. The figure from the paper and talk."
    thumbnail: "thumbs/shader-maxwell-time.webp"
    viewUrl: "https://www.shadertoy.com/view/XXdfz4"

  - id: pixel-zoom
    title: "Pixel Zoom Slide"
    explanation: "Sub-pixel structure of a marbling pattern (Gel-Git and Nonpareil): the pattern, its 16x16 subsamples, and the averaged color."
    thumbnail: "thumbs/shader-pixel-zoom.webp"
    viewUrl: "https://www.shadertoy.com/view/7fK3Ry"
